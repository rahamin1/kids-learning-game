<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>אישור הרשמה לעדכונים | היער הזוהר</title>
  <style>
    :root{font-family:Arial,sans-serif;color:#17395f;background:#eaf7ff}*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:24px 14px;display:grid;place-items:center;background:linear-gradient(145deg,#e4f7ff,#fff9df)}main{width:min(560px,100%);text-align:center}.brand{display:inline-flex;align-items:center;gap:10px;text-decoration:none;color:#17395f;font-weight:800}.brand span{display:grid;place-items:center;width:42px;height:42px;border-radius:14px;background:#1e67c6;color:#fff;font-size:22px}.card{margin-top:24px;padding:42px 28px;border-radius:28px;background:#fff;box-shadow:0 12px 35px rgba(25,70,105,.14)}.icon{display:grid;place-items:center;width:76px;height:76px;margin:0 auto 18px;border-radius:24px;background:#e5f2ff;font-size:38px}h1{margin:0 0 12px;font-size:clamp(27px,7vw,38px)}p{margin:0 auto 12px;max-width:430px;line-height:1.65;color:#4b6680;font-size:17px}.note{margin-top:23px;padding:13px 15px;border-radius:14px;background:#fff8df;color:#765615;font-size:14px}.button{display:inline-block;margin-top:24px;padding:13px 20px;border-radius:14px;background:#1e67c6;color:#fff;text-decoration:none;font-weight:800}
  </style>
</head>
<body>
  <main>
    <a class="brand" href="./" aria-label="חזרה ליער הזוהר"><span>★</span>היער הזוהר</a>
    <section class="card">
      <div class="icon">✉️</div>
      <h1>כמעט סיימנו!</h1>
      <p>שלחנו לכם הודעה לכתובת המייל. כדי להשלים את ההרשמה לעדכונים, לחצו על הקישור שבהודעה.</p>
      <p class="note">לא קיבלתם הודעה? בדקו גם בתיקיית דואר הזבל.</p>
      <a class="button" href="./">חזרה למשחק</a>
    </section>
  </main>
</body>
</html>
